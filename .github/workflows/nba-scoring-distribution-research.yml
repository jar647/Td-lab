name: NBA scoring distribution research
on:
  pull_request:
    paths:
      - 'nba_possession_engine.js'
      - 'nba_spread_strength.js'
      - 'scripts/nba_margin_variance_research.cjs'
      - 'scripts/nba_opponent_possession_research.cjs'
      - 'scripts/nba_scoring_distribution_research.cjs'
      - '.github/workflows/nba-scoring-distribution-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoring-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/nba_scoring_distribution_research.cjs > /tmp/nba-scoring-distribution.json
          node -e "const {rows, skipped, ...summary}=require('/tmp/nba-scoring-distribution.json'); console.log(JSON.stringify(summary,null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: nba-scoring-distribution
          path: /tmp/nba-scoring-distribution.json
