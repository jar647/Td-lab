name: NBA opportunity tracking
on:
  schedule:
    - cron: '20 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-opportunities
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official NBA tracking metrics
        run: python3 scripts/fetch_nba_opportunities.py
      - name: Commit verified feed only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified NBA opportunity tracking"
            git push
          fi
