name: Free NBA season stats
on:
  schedule:
    - cron: '35 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-free-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch free BoxScore Lab NBA season stats
        run: python3 scripts/fetch_nba_free_stats.py
      - name: Commit verified feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_free_stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh free NBA season stats"
            git push
          fi
