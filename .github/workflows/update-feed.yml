name: TD LAB verified NFL feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_feed.py'
      - 'capture_prop_probabilities.py'
      - 'grade_prop_probabilities.py'
      - 'grade_prop_probabilities.py'
      - 'historical_participation.py'
      - 'opportunity_prop_model.py'
      - 'game_picks.py'
      - 'scripts/calibrate_td.py'
      - 'scripts/grade_forward_bets.py'
      - 'scripts/audit_feed_totals.py'
      - 'scripts/audit_history.py'
      - 'scripts/verification_report.py'
      - 'tests/**'
      - '.github/workflows/update-feed.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '25 11 * * *'
    # Refresh near NFL game windows; GitHub schedules may run late.
    - cron: '15 16-23 * * 0,1,4'
    - cron: '15 0-4 * * 1,2,5'
permissions:
  contents: write
concurrency:
  group: td-lab-feed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify NFL engine Python syntax
        run: python -m compileall -q build_feed.py capture_prop_probabilities.py grade_prop_probabilities.py historical_participation.py opportunity_prop_model.py player_prop_probability_backtest.py tests
      - name: Test touchdown probability calibration
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build verified feed
        run: python build_feed.py
      - name: Build game-picks research slate
        run: python game_picks.py
      - name: Freeze pregame player prop probabilities for future validation
        run: python capture_prop_probabilities.py
      - name: Grade only completed snap-verified frozen player prop forecasts
        run: python grade_prop_probabilities.py
      - name: Reconcile every player and defensive stat before publishing
        run: python scripts/audit_feed_totals.py
      - name: Audit frozen pregame history
        run: python scripts/audit_history.py
      - name: Calibrate touchdown probabilities from eligible graded weeks
        run: python scripts/calibrate_td.py
      - name: Grade frozen prospective decisions
        run: python scripts/grade_forward_bets.py
      - name: Publish bet verification audit
        run: python scripts/verification_report.py
      - name: Commit updated data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game_picks.json data/matchups.json data/defense_stats_audit.json data/feed_audit.json data/status.json data/history/ data/probability_model.json data/history_audit.json data/forward/performance.json data/verification_status.json data/forward/prop_snapshots/ data/forward/prop_probability_performance.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified NFL matchup feed"
            # A developer commit can land while the feed is building.
            # Replay only this data commit on the latest main before pushing.
            # Fail visibly on a genuine data conflict instead of overwriting it.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another update (attempt $attempt); retrying."
              sleep 3
            done
            echo "Feed built, but could not publish after three push attempts." >&2
            exit 1
          fi
