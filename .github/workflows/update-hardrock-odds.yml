name: Update Hard Rock anytime TD odds
on:
  workflow_dispatch:
  schedule:
    - cron: '15 13,17,21 * * 4,5,6,0,1'
permissions:
  contents: write
concurrency:
  group: hardrock-odds-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export verified YES anytime TD odds
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: python scripts/build_hardrock_feed.py
      - name: Archive timestamped prices for forward testing
        run: python scripts/archive_odds.py
      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hardrock_anytime_td.json data/odds_history/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified Hard Rock anytime TD prices"
            git push
          fi
