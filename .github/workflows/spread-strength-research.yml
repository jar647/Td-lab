name: Spread-first team strength research
on:
  pull_request:
    paths:
      - 'nfl_spread_strength_research.py'
      - 'scripts/nba_spread_strength_research.cjs'
      - '.github/workflows/spread-strength-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nfl-strength:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          set -o pipefail
          python nfl_spread_strength_research.py | tee nfl-strength-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-strength-report
          path: nfl-strength-report.json
  nba-strength:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -o pipefail
          node scripts/nba_spread_strength_research.cjs | tee nba-strength-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nba-strength-report
          path: nba-strength-report.json
