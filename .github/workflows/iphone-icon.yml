name: Generate iPhone app icon
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert icon to iPhone PNG
        run: |
          python3 -m pip install cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='apple-touch-icon.svg',write_to='apple-touch-icon.png',output_width=180,output_height=180)
          PY
      - name: Publish icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish Let Me Cook iPhone icon"
            git push
          fi
