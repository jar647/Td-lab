name: UFC Fight Center checks
on:
  push:
    paths:
      - 'ufc.html'
      - 'ufc.css'
      - 'ufc_app.js'
      - 'ufc_matchup_research.js'
      - 'ufc_prop_research.js'
      - 'ufc_pick_engine.js'
      - 'test_ufc_pick_engine.js'
      - 'test_ufc_prop_research.js'
      - 'test_ufc_matchup_research.js'
      - 'test_ufc_app.js'
      - 'scripts/refresh_ufc.py'
      - 'scripts/refresh_ufc_history.py'
      - 'tests/test_ufc_history.py'
      - 'ufc_history_data.json'
      - 'scripts/validate_ufc_cache.py'
      - 'ufc_fighter_data.json'
      - 'tests/test_ufc_refresh.py'
      - 'scripts/test_ufc_refresh_unit.py'
      - 'ufc_research_engine.js'
      - 'test_ufc_research.js'
      - '.github/workflows/ufc-checks.yml'
  pull_request:
    paths:
      - '*ufc*'
      - 'scripts/refresh_ufc.py'
      - 'scripts/refresh_ufc_history.py'
      - 'tests/test_ufc_history.py'
      - 'ufc_history_data.json'
      - 'scripts/validate_ufc_cache.py'
      - 'ufc_fighter_data.json'
      - 'tests/test_ufc_refresh.py'
      - '.github/workflows/ufc-checks.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run UFC research tests
        run: |
          node --check ufc_app.js
          node test_ufc_research.js
          python scripts/validate_ufc_cache.py
          python -m py_compile scripts/refresh_ufc.py scripts/validate_ufc_cache.py
          node test_ufc_app.js
          node test_ufc_matchup_research.js
          node test_ufc_prop_research.js
          node test_ufc_pick_engine.js
          python -m unittest discover -s tests -p 'test_ufc*.py'
          python scripts/test_ufc_refresh_unit.py
      - name: Check live ESPN UFC feed structure
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request
          url='https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard'
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=15) as r:
                  d=json.load(r)
              events=d.get('events',[])
              print('Events:',len(events))
              for e in events[:5]:
                  comps=e.get('competitions',[])
                  print('Event:',e.get('name'),'competitions:',len(comps),'first competitors:',len((comps[0] if comps else {}).get('competitors',[])))
              if not events: print('WARNING: ESPN returned no current events; full-card availability not verified')
          except Exception as exc:
              print('WARNING: Live feed could not be checked:',exc)
          PY

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test client
        run: npm install --no-save playwright@1.62.1
      - name: Verify the single-pick UI and existing UFC flows
        env:
          UFC_CHROMIUM_PATH: /usr/bin/google-chrome
        run: node test_ufc_browser.js
