name: NBA simulator walk-forward validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nba_tracker.py'
      - 'test_nba_tracker_integrity.py'
      - 'test_nba_tracker_tipoff.py'
      - 'game_odds_engine.js'
      - 'scripts/run_nba_simulator_backtest.cjs'
      - 'scripts/nba_pretip_evidence.cjs'
      - 'scripts/nba_pretip_evidence.test.cjs'
      - 'scripts/nba_market_benchmark.test.cjs'
      - 'data/nba_games.json'
      - '.github/workflows/nba-simulator-backtest.yml'
  push:
    branches: [main]
    paths:
      - 'nba_tracker.py'
      - 'test_nba_tracker_integrity.py'
      - 'test_nba_tracker_tipoff.py'
      - 'game_odds_engine.js'
      - 'scripts/run_nba_simulator_backtest.cjs'
      - 'scripts/nba_pretip_evidence.cjs'
      - 'scripts/nba_pretip_evidence.test.cjs'
      - 'scripts/nba_market_benchmark.test.cjs'
      - 'data/nba_games.json'
      - '.github/workflows/nba-simulator-backtest.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test immutable NBA player forecast identity and tipoff
        run: python -m unittest -v test_nba_tracker_integrity test_nba_tracker_tipoff
      - name: Test NBA pretip evidence gate
        run: node --test scripts/nba_pretip_evidence.test.cjs scripts/nba_market_benchmark.test.cjs
      - name: Run NBA simulator walk-forward test
        run: node scripts/run_nba_simulator_backtest.cjs
      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-simulator-walkforward
          path: data/nba_simulator_backtest.json
          if-no-files-found: warn
