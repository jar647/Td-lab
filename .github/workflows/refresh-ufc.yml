name: Refresh UFC fighter research
on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch public cards and authenticated fighter statistics
        id: fetch
        env:
          FIGHTERAPI_KEY: ${{ secrets.FIGHTERAPI_KEY }}
        run: python scripts/refresh_ufc.py
      - name: Refresh public finish records and durations
        id: history
        if: ${{ !cancelled() }}
        run: python scripts/refresh_ufc_history.py
      - name: Validate cache and model integration
        id: validate
        if: ${{ !cancelled() }}
        run: |
          node test_ufc_research.js
          python scripts/validate_ufc_cache.py
          python -m py_compile scripts/refresh_ufc.py scripts/validate_ufc_cache.py
          node test_ufc_app.js
          node test_ufc_matchup_research.js
          node test_ufc_prop_research.js
          python -m unittest discover -s tests -p 'test_ufc*.py'
          if [ -f ufc_history_data.json ]; then python -m json.tool ufc_history_data.json >/dev/null; fi
          if [ -f ufc_schedule.json ]; then python -m json.tool ufc_schedule.json >/dev/null; fi
          if [ -f ufc_fighter_data.json ]; then python -m json.tool ufc_fighter_data.json >/dev/null; fi
      - name: Commit refreshed public statistics only
        if: ${{ success() && steps.fetch.outcome == 'success' && steps.history.outcome == 'success' && steps.validate.outcome == 'success' }}
        run: |
          if [ -f ufc_fighter_data.json ] || [ -f ufc_schedule.json ] || [ -f ufc_history_data.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for file in ufc_fighter_data.json ufc_schedule.json ufc_history_data.json; do
              if [ -f "$file" ]; then git add "$file"; fi
            done
            git diff --cached --quiet || (git commit -m "Refresh UFC fighter research cache" && git push)
          fi
