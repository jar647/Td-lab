name: NFL analyst regression tests
on:
  push:
    paths:
      - 'analyst.html'
      - 'index.html'
      - 'game-odds.html'
      - 'game_odds_engine.js'
      - 'game_odds_worker.js'
      - 'nfl_matchup_scenario.js'
      - 'nfl_matchup_research.py'
      - 'game_picks.py'
      - 'test_nfl_matchup_scenario.js'
      - 'test_nfl_matchup_scenario.py'
      - 'nfl_matchup_research_ui.js'
      - 'test_nfl_matchup_research_ui.js'
      - 'test_nfl_shared_research.js'
      - 'test_game_odds.js'
      - 'test_game_odds_ui.js'
      - 'game_odds_manual_review.js'
      - 'test_game_odds_manual_review.js'
      - 'test_game_trust_ui.js'
      - 'nba.html'
      - 'market_odds.js'
      - 'player_probability.js'
      - 'test_player_probability.js'
      - 'test_market_odds.js'
      - 'nfl_game_engine.js'
      - 'nfl_goal1.js'
      - 'nfl_td_matchup.js'
      - 'nfl_player_board.js'
      - 'nfl_top_plays.js'
      - 'nfl_top_plays_ui.js'
      - 'nfl_book_review.js'
      - 'nfl_parlay.js'
      - 'nfl_parlay_optimizer.js'
      - 'nfl_parlay_optimizer_worker.js'
      - 'test_nfl_offered_optimizer.js'
      - 'test_nfl_offered_ui.js'
      - 'test_nfl_receiver_efficiency.js'
      - 'nfl_parlay_ui.js'
      - 'nfl_anytime_parlay_ui.js'
      - 'test_nfl_anytime_parlay.js'
      - 'test_nfl_anytime_parlay_ui.js'
      - 'test_nfl_parlay.js'
      - 'test_nfl_parlay_ui.js'
      - 'test_nfl_parlay_engine.js'
      - 'test_nfl_quick_slip_side.js'
      - 'quick_slip.js'
      - 'research_slip.js'
      - 'nba_auto_alt_ui.js'
      - 'js/unpriced-alt-lines.js'
      - 'js/alt-line-cards.js'
      - 'test_auto_alt_lines.js'
      - 'quick_slip_ticket.js'
      - 'test_quick_slip_ticket.js'
      - 'test_nfl_book_review.js'
      - 'test_nfl_book_review_ui.js'
      - 'test_nfl_top_plays.js'
      - 'test_nfl_top_plays_ui.js'
      - 'test_nfl_best_singles_ui.js'
      - 'test_nfl_td_matchup.js'
      - 'test_nfl_player_board.js'
      - 'test_nfl_history_chart.js'
      - 'test_nfl_goal1.js'
      - 'test_nfl_matchup_score.js'
      - 'test_nfl_min_score_ui.js'
      - 'test_nfl_scenario_ui.js'
      - 'test_nfl_real_matchup.js'
      - 'nfl_game_worker.js'
      - 'test_analyst_ui.js'
      - 'test_nfl_analyst_ui.js'
      - 'test_nfl_game_engine.js'
      - '.github/workflows/test-nfl-analyst.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check test_analyst_ui.js
      - run: node test_market_odds.js
      - run: node test_game_odds.js
      - run: node test_game_odds_manual_review.js
      - run: node test_game_trust_ui.js
      - run: node test_nfl_matchup_scenario.js
      - run: python -m unittest -v test_nfl_matchup_scenario.py
      - run: node test_game_odds_ui.js
      - run: node test_nfl_matchup_research_ui.js
      - run: node test_nfl_shared_research.js
      - run: node test_player_probability.js
      - run: node test_analyst_ui.js
      - run: node test_nfl_game_engine.js
      - run: node test_nfl_goal1.js
      - run: node test_nfl_td_matchup.js
      - run: node test_nfl_player_board.js
      - run: node test_nfl_top_plays.js
      - run: node test_nfl_top_plays_ui.js
      - run: node test_nfl_best_singles_ui.js
      - run: node test_nfl_book_review.js
      - run: node test_nfl_book_review_ui.js
      - run: node test_nfl_parlay.js
      - run: node test_nfl_parlay_ui.js
      - run: node test_nfl_offered_optimizer.js
      - run: node test_nfl_offered_ui.js
      - run: node test_nfl_optimizer_worker.js
      - run: node test_nfl_receiver_efficiency.js
      - run: node test_nfl_efficiency_audit.js
      - run: node test_nfl_anytime_parlay.js
      - run: node test_nfl_anytime_parlay_ui.js
      - run: node test_nfl_parlay_engine.js
      - run: node test_nfl_quick_slip_side.js
      - run: node test_quick_slip_ticket.js
      - run: node test_auto_alt_lines.js
      - run: node test_nfl_history_chart.js
      - run: node test_nfl_matchup_score.js
      - run: node test_nfl_min_score_ui.js
      - run: node test_nfl_scenario_ui.js
      - run: node test_nfl_analyst_ui.js
      - run: node test_nfl_real_matchup.js
