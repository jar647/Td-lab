name: NFL analyst regression tests
on:
  push:
    paths:
      - 'analyst.html'
      - 'index.html'
      - 'nba.html'
      - 'market_odds.js'
      - 'player_probability.js'
      - 'test_player_probability.js'
      - 'test_market_odds.js'
      - 'nfl_game_engine.js'
      - 'nfl_goal1.js'
      - 'test_nfl_goal1.js'
      - 'test_nfl_real_matchup.js'
      - 'nfl_game_worker.js'
      - 'test_analyst_ui.js'
      - 'test_nfl_analyst_ui.js'
      - 'test_nfl_game_engine.js'
      - '.github/workflows/test-nfl-analyst.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check test_analyst_ui.js
      - run: node test_market_odds.js
      - run: node test_player_probability.js
      - run: node test_analyst_ui.js
      - run: node test_nfl_game_engine.js
      - run: node test_nfl_goal1.js
      - run: node test_nfl_analyst_ui.js
      - run: node test_nfl_real_matchup.js
