name: NFL simulator tests
on:
  push:
    branches: [main]
    paths:
      - 'nfl_game_engine.js'
      - 'scripts/audit_nfl_receiver_efficiency.js'
      - 'scripts/prepare_nfl_efficiency_history.py'
      - 'test_nfl_receiver_efficiency.js'
      - 'nfl_backtest.js'
      - 'tests/nfl_game_engine.test.js'
      - 'tests/nfl_backtest.test.js'
      - 'tests/nfl_backtest_cli.test.js'
      - 'scripts/grade_nfl_simulator.js'
      - '.github/workflows/nfl-tests.yml'
  pull_request:
    paths:
      - 'nfl_game_engine.js'
      - 'scripts/audit_nfl_receiver_efficiency.js'
      - 'scripts/prepare_nfl_efficiency_history.py'
      - 'test_nfl_receiver_efficiency.js'
      - 'tests/nfl_game_engine.test.js'
      - '.github/workflows/nfl-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test_nfl_receiver_efficiency.js
      - run: node --check nfl_game_engine.js
      - run: node --check nfl_backtest.js
      - run: node --test tests/nfl_game_engine.test.js tests/nfl_backtest.test.js tests/nfl_backtest_cli.test.js

  receiver-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Prepare dated historical player statistics
        run: |
          python scripts/prepare_nfl_efficiency_history.py 2024 "$RUNNER_TEMP/nfl-2024.json"
          python scripts/prepare_nfl_efficiency_history.py 2025 "$RUNNER_TEMP/nfl-2025.json"
      - name: Compare receiver correction on earlier-week inputs
        run: |
          node scripts/audit_nfl_receiver_efficiency.js "$RUNNER_TEMP/nfl-2024.json" "$RUNNER_TEMP/nfl-efficiency-2024.json" > "$RUNNER_TEMP/nfl-efficiency-2024.log"
          node scripts/audit_nfl_receiver_efficiency.js "$RUNNER_TEMP/nfl-2025.json" "$RUNNER_TEMP/nfl-efficiency-2025.json" > "$RUNNER_TEMP/nfl-efficiency-2025.log"
          node -e 'const fs=require("fs");for(const season of [2024,2025]){const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/nfl-efficiency-"+season+".json"));console.log(season,r.status,r.folds.validation);if(r.status!=="PAIRED_DIAGNOSTIC_PASSED_NOT_CALIBRATED")process.exitCode=1;}'
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-receiver-efficiency-comparison
          path: |
            ${{ runner.temp }}/nfl-efficiency-*.json
            ${{ runner.temp }}/nfl-efficiency-*.log
          retention-days: 30
