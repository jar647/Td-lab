name: NFL simulator tests
on:
  push:
    paths:
      - 'nfl_game_engine.js'
      - 'nfl_backtest.js'
      - 'tests/nfl_game_engine.test.js'
      - 'tests/nfl_backtest.test.js'
      - 'tests/nfl_backtest_cli.test.js'
      - 'scripts/grade_nfl_simulator.js'
      - '.github/workflows/nfl-tests.yml'
  pull_request:
    paths:
      - 'nfl_game_engine.js'
      - 'tests/nfl_game_engine.test.js'
      - '.github/workflows/nfl-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check nfl_game_engine.js
      - run: node --check nfl_backtest.js
      - run: node --test tests/nfl_game_engine.test.js tests/nfl_backtest.test.js tests/nfl_backtest_cli.test.js
