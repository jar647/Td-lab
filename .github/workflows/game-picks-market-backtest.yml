name: Backtest Game Picks vs Market
on:
  workflow_dispatch:
  push:
    paths:
      - 'game_picks_market_backtest.py'
      - 'game_picks_simulator_audit.py'
      - '.github/workflows/game-picks-market-backtest.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare historical scores against available market lines
        run: python game_picks_market_backtest.py
      - name: Audit Monte Carlo score assumptions on held-out games
        run: python game_picks_simulator_audit.py
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game_picks_market_comparison.json data/game_picks_simulator_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish historical game picks market comparison"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
