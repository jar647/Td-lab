name: NBA data refresh
on:
  push:
    branches: [main]
    paths:
      - 'nba_possession_engine.js'
      - 'nba_simulator_ui.js'
      - 'test_nba_simulator_ui.js'
      - 'scripts/publish_nba_simulator.js'
      - 'nba_feed.py'
      - 'nba_shot_profile.py'
      - 'nba_rotation_profile.py'
      - 'nba_game_context.py'
      - 'nba_game_context.js'
      - 'nba_live_context.js'
      - 'nba_model.py'
      - 'nba_pipeline.py'
      - 'nba_pipeline_ui.js'
      - 'scripts/build_nba_odds.py'
      - 'test_nba_pipeline.py'
      - 'test_nba_odds.py'
      - 'test_nba_pipeline_ui.js'
      - 'nba_first_basket.py'
      - 'nba_first_basket.js'
      - 'test_nba_first_basket.py'
      - 'test_nba_first_basket.js'
      - 'nba_daily_learning.py'
      - 'test_nba_daily_learning.py'
      - 'nba_tracker.py'
      - 'nba_injuries.py'
      - 'nba_rosters.py'
      - 'test_nba_contracts.py'
      - 'test_nba_ui.js'
      - 'test_nba_simulator.js'
      - 'nba.html'
      - 'nba_game_first.js'
      - 'nba_matchup_discovery.js'
      - 'scripts/verify_nba_matchup_discovery.js'
      - 'tests/nba_game_first.test.js'
      - 'market_odds.js'
      - 'player_probability.js'
      - 'test_player_probability.js'
      - 'test_market_odds.js'
      - '.github/workflows/nba-feed.yml'
      - 'scripts/archive_nba_evidence.py'
      - 'scripts/check_nba_evidence_archive.py'
      - 'scripts/grade_nba_prospective.py'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh both daily and within the game day (ET); UTC schedule is fixed.
    # Includes morning completed-game grading and afternoon injury/rotation checks.
    - cron: '12,42 * * * *'
concurrency:
  group: nba-feed-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test locked NBA forecasts and daily learning
        run: python -m unittest -v test_nba_pipeline.py test_nba_odds.py test_nba_contracts.py test_nba_daily_learning.py test_nba_first_basket.py
      - name: Test NBA UI and simulations
        run: |
          node test_market_odds.js
          node test_player_probability.js
          node test_game_odds.js
          node test_game_odds_ui.js
          node test_nba_pipeline_ui.js
          node tests/test_nba_matchup_discovery.js
          node --test tests/nba_game_first.test.js
          node test_nba_ui.js
          node test_nba_simulator.js
          node test_nba_simulator_ui.js
          node test_nba_first_basket.js
      - name: Build research-only daily learning report from tracked results
        run: python nba_daily_learning.py
  refresh:
    if: github.event_name != 'pull_request'
    timeout-minutes: 25
    env:
      ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and publish NBA records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          python nba_feed.py
          python nba_rosters.py || echo 'Roster source unavailable; existing file retained'
          python nba_injuries.py || echo 'Injury source unavailable; existing file retained, UI will reject stale records'
          python nba_game_context.py
          python nba_tracker.py
          python -m scripts.build_nba_odds
          python nba_pipeline.py
          node scripts/publish_nba_simulator.js
          python nba_daily_learning.py
          python scripts/archive_nba_evidence.py
          python scripts/check_nba_evidence_archive.py
          python scripts/grade_nba_prospective.py
          python -m unittest -v test_nba_pipeline.py test_nba_odds.py test_nba_contracts.py test_nba_daily_learning.py test_nba_first_basket.py
          node test_market_odds.js
          node test_player_probability.js
          node test_nba_pipeline_ui.js
          node tests/test_nba_matchup_discovery.js
          node --test tests/nba_game_first.test.js
          node test_nba_ui.js
          node test_nba_simulator.js
          node test_nba_first_basket.js
          git add data/nba_simulator_report.json data/nba_simulator_locks.json
          git add data/nba_evidence_archive.json data/nba_prospective_accuracy.json
          git add data/nba_games.json data/nba_projection_tracker.json data/nba_daily_learning.json data/nba_analysis.json data/nba_pipeline_locks.json data/nba_market_status.json
          if test -f data/nba_market_odds.json; then git add data/nba_market_odds.json; fi
          if test -f data/nba_season_stats.json; then git add data/nba_season_stats.json; fi
          if test -f data/nba_rosters.json; then git add data/nba_rosters.json; fi
          # Fast availability writer owns these files; retain newer published snapshots.
          git restore --worktree -- data/nba_injuries.json data/nba_game_context.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh NBA game data and locked projections"
          # Rebase the completed data commit over disjoint writers instead of recomputing it.
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

