name: NBA data refresh
on:
  push:
    paths:
      - 'nba_feed.py'
      - 'nba_tracker.py'
      - '.github/workflows/nba-feed.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 */3 * * *'
concurrency:
  group: nba-feed-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git pull --ff-only origin main
      - run: python nba_feed.py
      - run: python nba_tracker.py
      - name: Commit NBA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_games.json data/nba_projection_tracker.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NBA game data"
            git push origin HEAD:main
          fi
