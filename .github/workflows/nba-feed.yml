name: NBA data refresh
on:
  push:
    branches: [main]
    paths:
      - 'nba_feed.py'
      - 'nba_daily_learning.py'
      - 'test_nba_daily_learning.py'
      - 'nba_tracker.py'
      - 'nba_injuries.py'
      - 'nba_rosters.py'
      - 'test_nba_contracts.py'
      - 'test_nba_ui.js'
      - 'test_nba_simulator.js'
      - 'nba.html'
      - 'market_odds.js'
      - 'player_probability.js'
      - 'test_player_probability.js'
      - 'test_market_odds.js'
      - '.github/workflows/nba-feed.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh both daily and within the game day (ET); UTC schedule is fixed.
    # Includes morning completed-game grading and afternoon injury/rotation checks.
    - cron: '15 */3 * * *'
concurrency:
  group: nba-feed-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test locked NBA forecasts and daily learning
        run: python -m unittest -v test_nba_contracts.py test_nba_daily_learning.py
      - name: Test NBA UI and simulations
        run: |
          node test_market_odds.js
          node test_player_probability.js
          node test_nba_ui.js
          node test_nba_simulator.js
      - name: Build research-only daily learning report from tracked results
        run: python nba_daily_learning.py
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and publish NBA records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python nba_feed.py
            python nba_rosters.py || echo 'Roster source unavailable; existing file retained'
            python nba_injuries.py || echo 'Injury source unavailable; existing file retained, UI will reject stale records'
            python nba_tracker.py
            python nba_daily_learning.py
            python -m unittest -v test_nba_contracts.py test_nba_daily_learning.py
            node test_market_odds.js
            node test_player_probability.js
            node test_nba_ui.js
            node test_nba_simulator.js
            git add data/nba_games.json data/nba_projection_tracker.json data/nba_daily_learning.json
            if test -f data/nba_season_stats.json; then git add data/nba_season_stats.json; fi
            if test -f data/nba_rosters.json; then git add data/nba_rosters.json; fi
            if test -f data/nba_injuries.json; then git add data/nba_injuries.json; fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh NBA game data and locked projections"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update detected; retrying from latest main"
            sleep 3
          done
          exit 1
