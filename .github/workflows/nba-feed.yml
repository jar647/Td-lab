name: NBA data refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */3 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python nba_feed.py
      - name: Commit NBA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_games.json
          git diff --cached --quiet || (git commit -m "Refresh NBA game data" && git push)
