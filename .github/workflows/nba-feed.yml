name: NBA data refresh
on:
  push:
    paths:
      - 'nba_feed.py'
      - 'nba_tracker.py'
      - 'test_nba_contracts.py'
      - '.github/workflows/nba-feed.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 */3 * * *'
concurrency:
  group: nba-feed-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and publish NBA records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python nba_feed.py
            python nba_tracker.py
            python -m unittest -v test_nba_contracts.py
            git add data/nba_games.json data/nba_projection_tracker.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh NBA game data and locked projections"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update detected; retrying from latest main"
            sleep 3
          done
          exit 1
