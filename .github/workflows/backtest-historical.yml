name: TD LAB retrospective research backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backtest_historical.py'
      - 'evaluate_historical.py'
      - 'scripts/calibrate_td.py'
      - '.github/workflows/backtest-historical.yml'
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reconstruct 2024 and 2025 retrospective weeks
        run: python backtest_historical.py
      - name: Evaluate chronological holdout against baseline
        run: python evaluate_historical.py
      - name: Preserve research-only dataset
        uses: actions/upload-artifact@v4
        with:
          name: td-lab-retrospective-2024-2025
          path: |
            data/retrospective/weekly.json
            data/retrospective/evaluation.json
          retention-days: 30
