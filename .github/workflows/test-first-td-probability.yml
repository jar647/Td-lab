name: Test first TD probability model
on:
  push:
    branches: [main]
    paths:
      - 'first_td_probability.js'
      - 'index.html'
      - 'tests/test_first_td_probability.js'
      - '.github/workflows/test-first-td-probability.yml'
  pull_request:
    branches: [main]
    paths:
      - 'first_td_probability.js'
      - 'index.html'
      - 'tests/test_first_td_probability.js'
      - '.github/workflows/test-first-td-probability.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/test_first_td_probability.js
