name: Verify live NBA Pages publication

on:
  pull_request:
    paths:
      - 'nba.html'
      - 'nba_auto_alt_ui.js'
      - 'nba_game_first.js'
      - 'nba_selection_ui.js'
      - 'nba_parlay_worker.js'
      - '.github/workflows/verify-live-nba-pages.yml'
  push:
    branches: [main]
    paths:
      - 'nba.html'
      - 'nba_auto_alt_ui.js'
      - 'nba_game_first.js'
      - 'nba_selection_ui.js'
      - 'nba_parlay_worker.js'
      - '.github/workflows/verify-live-nba-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-nba:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify published NBA page and simulated props UI
        shell: bash
        run: |
          set -euo pipefail
          site='https://jar647.github.io/Td-lab'
          verify_selection_gate() {
            if [ "${GITHUB_EVENT_NAME}" != "push" ]; then return 0; fi
            ! grep -Fq 'Where to look &amp; why' /tmp/prop-shop-nba.html &&
            ! grep -Fq 'renderNBAMatchups(g)' /tmp/prop-shop-nba.html &&
            grep -Fq 'NBA Best Props' /tmp/prop-shop-nba.html &&
            grep -Fq 'INCOMPLETE CHECK' /tmp/prop-shop-nba.html &&
            grep -Fq 'nbaRefreshVisibleSlate' /tmp/prop-shop-nba.html &&
            grep -Fq 'UNDERS are being evaluated in shadow mode at 85/100 (threes 90/100)' /tmp/prop-shop-nba.html &&
            grep -Fq 'nba_game_first.js?v=nba-best-props-gate-20261120-v2' /tmp/prop-shop-nba.html &&
            grep -Fq 'nba_selection_ui.js?v=nba-best-props-gate-20261120-v2' /tmp/prop-shop-nba.html &&
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba_game_first.js?verify=${GITHUB_SHA}" -o /tmp/prop-shop-game-first.js &&
            grep -Fq '!Number.isFinite(row.matchupBoost)' /tmp/prop-shop-game-first.js &&
            ! grep -Fq '!(row.matchupBoost>0)' /tmp/prop-shop-game-first.js &&
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba_selection_ui.js?verify=${GITHUB_SHA}" -o /tmp/prop-shop-selection-ui.js &&
            grep -Fq 'reuseFreshInputs' /tmp/prop-shop-selection-ui.js &&
            grep -Fq 'nba_parlay_worker.js?v=nba-best-props-gate-20261120-v2' /tmp/prop-shop-selection-ui.js &&
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba_parlay_worker.js?verify=${GITHUB_SHA}" -o /tmp/prop-shop-worker.js &&
            grep -Fq 'nba_game_first.js?v=nba-best-props-gate-20261120-v2' /tmp/prop-shop-worker.js &&
            grep -Fq 'gamesAnalyzed' /tmp/prop-shop-worker.js &&
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba_under_shadow.js?verify=${GITHUB_SHA}" -o /tmp/prop-shop-unders.js &&
            grep -Fq 'studyOnly:true' /tmp/prop-shop-unders.js &&
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/data/recommendations/nba_under_shadow.json?verify=${GITHUB_SHA}" -o /tmp/prop-shop-under-ledger.json &&
            grep -Fq '"betReady": false' /tmp/prop-shop-under-ledger.json
          }
          for attempt in $(seq 1 24); do
            echo "Live deployment verification attempt ${attempt}/24"
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba.html?verify=${GITHUB_SHA}" -o /tmp/prop-shop-nba.html \
              && grep -Fq 'NBA Best Props' /tmp/prop-shop-nba.html \
              && ! grep -Fq 'r.topThree.map(nbaMatchupCard)' /tmp/prop-shop-nba.html \
              && grep -Fq 'nbaAutoAltView.render(top)' /tmp/prop-shop-nba.html \
              && grep -Fq 'nba_auto_alt_ui.js' /tmp/prop-shop-nba.html \
              && curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba_auto_alt_ui.js?verify=${GITHUB_SHA}" -o /tmp/prop-shop-auto-alt.js \
              && grep -Fq 'simulated' /tmp/prop-shop-auto-alt.js \
              && verify_selection_gate; then
              echo 'PASS: Live NBA Game Explorer omits the retired historical panel while Best Props and the simulation-backed prop interface remain published.'
              exit 0
            fi
            if [ "${attempt}" -lt 24 ]; then sleep 10; fi
          done
          echo 'FAIL: Could not verify the updated NBA page on the live GitHub Pages site.'
          exit 1
