name: Verify live NBA Pages publication

on:
  pull_request:
    paths:
      - 'nba.html'
      - 'nba_auto_alt_ui.js'
      - 'nba_game_first.js'
      - 'nba_selection_ui.js'
      - 'nba_parlay_worker.js'
      - 'nba_possession_engine.js'
      - 'nba_prop_lines.js'
      - 'nba_matchup_discovery.js'
      - 'recommendation_ledger.js'
      - 'results.html'
      - '.github/workflows/verify-live-nba-pages.yml'
      - 'scripts/nba_market_live_audit.cjs'
  push:
    branches: [main]
    paths:
      - 'nba.html'
      - 'nba_auto_alt_ui.js'
      - 'nba_game_first.js'
      - 'nba_selection_ui.js'
      - 'nba_parlay_worker.js'
      - 'nba_possession_engine.js'
      - 'nba_prop_lines.js'
      - 'nba_matchup_discovery.js'
      - 'recommendation_ledger.js'
      - 'results.html'
      - '.github/workflows/verify-live-nba-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-nba:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current NBA analysis code
        uses: actions/checkout@v4
      - name: Verify published NBA page and simulated props UI
        shell: bash
        run: |
          set -euo pipefail
          site='https://jar647.github.io/Td-lab'
          verify_current_release() {
            # PRs validate compatibility only. Pushes must prove the updated 80/100
            # two-sided defensive-market release is present on the public Pages URL.
            if [ "${GITHUB_EVENT_NAME}" != "push" ]; then return 0; fi
            grep -Fq 'One Best Single per game · 80/100 minimum.' /tmp/prop-shop-nba.html &&
            grep -Fq 'NBA Best Props' /tmp/prop-shop-nba.html &&
            grep -Fq 'INCOMPLETE CHECK' /tmp/prop-shop-nba.html &&
            grep -Fq 'nbaRefreshVisibleSlate' /tmp/prop-shop-nba.html &&
            grep -Fq 'nba_game_first.js?v=nba-prop-workload-1' /tmp/prop-shop-nba.html &&
            grep -Fq 'nba_selection_ui.js?v=nba-prop-board-v1' /tmp/prop-shop-nba.html &&
            grep -Fq 'Audit all 8 NBA markets' /tmp/prop-shop-nba.html &&
            grep -Fq 'Before the 80/100 gate' /tmp/prop-shop-nba.html &&
            grep -Fq 'nba_possession_engine.js?v=nba-prop-workload-1' /tmp/prop-shop-nba.html &&
            ! grep -Fq 'UNDERS are being evaluated in shadow mode at 85/100' /tmp/prop-shop-nba.html &&
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba_prop_lines.js?verify=${GITHUB_SHA}" -o /tmp/prop-shop-lines.js &&
            grep -Fq 'return canonical(market)?80:101;' /tmp/prop-shop-lines.js &&
            grep -Fq 'steals:[1,2,3' /tmp/prop-shop-lines.js &&
            grep -Fq 'blocks:[1,2,3' /tmp/prop-shop-lines.js &&
            grep -Fq 'stocks:[1,2,3' /tmp/prop-shop-lines.js &&
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba_game_first.js?verify=${GITHUB_SHA}" -o /tmp/prop-shop-game-first.js &&
            grep -Fq "'Steals + Blocks'" /tmp/prop-shop-game-first.js &&
            grep -Fq "for(const side of ['over','under'])" /tmp/prop-shop-game-first.js &&
            grep -Fq '!Number.isFinite(row.matchupBoost)' /tmp/prop-shop-game-first.js &&
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba_possession_engine.js?verify=${GITHUB_SHA}" -o /tmp/prop-shop-possessions.js &&
            grep -Fq 'nba-possession-audit-v5-defensive-counts' /tmp/prop-shop-possessions.js &&
            grep -Fq 'stats[p.id].stocks=stats[p.id].steals+stats[p.id].blocks' /tmp/prop-shop-possessions.js &&
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba_selection_ui.js?verify=${GITHUB_SHA}" -o /tmp/prop-shop-selection-ui.js &&
            grep -Fq 'reuseFreshInputs' /tmp/prop-shop-selection-ui.js &&
            grep -Fq 'marketAudit:marketAudit(data.candidates,accepted' /tmp/prop-shop-selection-ui.js &&
            grep -Fq 'nba_parlay_worker.js?v=nba-prop-workload-1' /tmp/prop-shop-selection-ui.js &&
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba_parlay_worker.js?verify=${GITHUB_SHA}" -o /tmp/prop-shop-worker.js &&
            grep -Fq 'nba_game_first.js?v=nba-prop-workload-1' /tmp/prop-shop-worker.js &&
            grep -Fq 'gamesAnalyzed' /tmp/prop-shop-worker.js &&
            grep -Fq 'diagnostics.scoreBands=bands' /tmp/prop-shop-worker.js &&
            grep -Fq 'diagnostics.marketStages=stages;' /tmp/prop-shop-worker.js &&
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/recommendation_ledger.js?verify=${GITHUB_SHA}" -o /tmp/prop-shop-ledger.js &&
            grep -Fq "p.market==='first_basket'" /tmp/prop-shop-ledger.js &&
            grep -Fq "stocks:['STL','BLK']" /tmp/prop-shop-ledger.js &&
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/results.html?verify=${GITHUB_SHA}" -o /tmp/prop-shop-results.html &&
            grep -Fq 'results.js?v=nba80-def-under-20261121' /tmp/prop-shop-results.html
          }
          for attempt in $(seq 1 24); do
            echo "Live deployment verification attempt ${attempt}/24"
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba.html?verify=${GITHUB_SHA}" -o /tmp/prop-shop-nba.html \
              && grep -Fq 'NBA Best Props' /tmp/prop-shop-nba.html \
              && ! grep -Fq 'r.topThree.map(nbaMatchupCard)' /tmp/prop-shop-nba.html \
              && grep -Fq 'nbaAutoAltView.render(top)' /tmp/prop-shop-nba.html \
              && grep -Fq 'nba_auto_alt_ui.js' /tmp/prop-shop-nba.html \
              && curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 "${site}/nba_auto_alt_ui.js?verify=${GITHUB_SHA}" -o /tmp/prop-shop-auto-alt.js \
              && grep -Fq 'simulated' /tmp/prop-shop-auto-alt.js \
              && verify_current_release; then
              echo 'PASS: Live NBA Pages publishes two-sided 80/100 policy, eleven markets, shared defensive simulation, Quick Slip worker and Results grading exclusions.'
              exit 0
            fi
            if [ "${attempt}" -lt 24 ]; then sleep 10; fi
          done
          echo 'FAIL: Could not verify the updated NBA page on the live GitHub Pages site.'
          exit 1

      - name: Run read-only live NBA market attrition audit
        shell: bash
        run: node scripts/nba_market_live_audit.cjs
