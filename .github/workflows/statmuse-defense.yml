name: StatMuse Defense Data
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/import_statmuse_defense.py'
      - 'tests/test_statmuse_defense.py'
      - '.github/workflows/statmuse-defense.yml'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate parser
        run: python -m unittest discover -s tests -p 'test_statmuse_defense.py'
      - name: Fetch StatMuse defense table
        run: python scripts/import_statmuse_defense.py
      - name: Save StatMuse audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statmuse-defense-data
          path: data/statmuse_defense.json
          if-no-files-found: warn
