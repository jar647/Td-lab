name: NBA pipeline and NFL regressions
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python -m unittest discover -s tests -v
      - name: All JavaScript contracts and NFL regressions
        run: |
          set -e
          for file in test*.js tests/test*.js; do node "$file"; done
