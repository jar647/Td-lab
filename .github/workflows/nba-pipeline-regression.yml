name: NBA pipeline and NFL regressions
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python -m unittest discover -s tests -v
      - name: All JavaScript contracts and NFL regressions
        run: |
          set -e
          for file in test*.js tests/test*.js tests/*.test.js; do node "$file"; done

  live-input-check:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check whether provider or model inputs changed
        id: provider-paths
        env:
          NBA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NBA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os, subprocess
          watched={'nba_rosters.py','nba_injuries.py','nba_model.py','nba_pipeline.py','scripts/build_nba_odds.py','scripts/build_hardrock_feed.py','requirements.txt'}
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['NBA_BASE_SHA'],os.environ['NBA_HEAD_SHA']],text=True).splitlines())
          needed=bool(changed & watched)
          prices=bool(changed & {'scripts/build_nba_odds.py','scripts/build_hardrock_feed.py'})
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('needed='+str(needed).lower()+'\nprices='+str(prices).lower()+'\n')
          print('Live provider check required:',needed)
          PY
      - name: Refresh real NBA input feeds in disposable checkout
        if: steps.provider-paths.outputs.needed == 'true'
        run: |
          python nba_feed.py
          python nba_rosters.py
          python nba_injuries.py
      - name: Verify the existing provider connection for NBA
        if: steps.provider-paths.outputs.prices == 'true'
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: python -m scripts.build_nba_odds
      - name: Run the published analyst with real current inputs
        if: steps.provider-paths.outputs.needed == 'true'
        run: python nba_pipeline.py
      - name: Record live-input evidence
        if: always() && steps.provider-paths.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nba-live-input-evidence
          path: |
            data/nba_market_status.json
            data/nba_analysis.json
          retention-days: 7
      - name: Require actual fresh prices when changing the odds provider
        if: steps.provider-paths.outputs.prices == 'true'
        run: |
          python - <<'PY'
          import json
          status=json.load(open('data/nba_market_status.json'))
          print('NBA provider status:',status.get('status'),status.get('reason_code','ok'))
          print('Safe source diagnostics:',json.dumps(status.get('diagnostics',{})))
          if status.get('status')!='ok':
              raise SystemExit('Live odds gate failed; see NBA provider status above. No fabricated prices substituted.')
          PY

  possession-live-check:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check possession input paths
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY2'
          import os,subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE'],os.environ['HEAD']],text=True).splitlines())
          needed=bool(paths & {'nba_game_first.js','nba_possession_engine.js','nba_simulator_ui.js','nba_feed.py','nba_shot_profile.py','nba_rotation_profile.py','nba_game_context.py','nba_game_context.js','game_odds_engine.js','scripts/publish_nba_simulator.js'})
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('needed='+str(needed).lower()+'\nprices='+str(prices).lower()+'\n')
          PY2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh free possession, injury and roster inputs
        if: steps.paths.outputs.needed == 'true'
        run: |
          python nba_feed.py
          python nba_rosters.py
          python nba_injuries.py
          python nba_game_context.py
      - name: Verify possession model on current source data
        if: steps.paths.outputs.needed == 'true'
        run: |
          node --test tests/nba_game_first.test.js
          node test_nba_possessions.js
          node test_nba_game_context.js
          python - <<'PY3'
          import json
          d=json.load(open('data/nba_game_context.json'))
          print('Free source checks:',{k:v.get('status') for k,v in d['sources'].items()})
          assert d['sources']['lineups']['status']=='ok', 'NBA.com lineup source unavailable'
          if d['sources']['tracking']['status']!='ok':
              assert not d['defenders'] or d['sources']['tracking']['status']=='partial'
              print('Tracking unavailable on this runner; dated cache/direct browser NBA.com fallback must remain explicit.')
          PY3

