name: NBA pipeline and NFL regressions
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python -m unittest discover -s tests -v
      - name: All JavaScript contracts and NFL regressions
        run: |
          set -e
          # UFC has its own ufc-tests.yml and ufc-checks.yml workflows,
          # with independent dependency setup and validation. Keep this job
          # restricted to NBA/NFL and shared non-UFC contracts.
          failures=()
          for file in test*.js tests/test*.js tests/*.test.js; do
            case "$file" in test_ufc*.js|tests/ufc*.test.js) continue ;; esac
            if ! node "$file"; then failures+=("$file"); fi
          done
          if (("${#failures[@]}" > 0)); then
            printf 'JavaScript regression failures (%s): %s\\n' "${#failures[@]}" "${failures[*]}"
            exit 1
          fi

  live-input-check:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check whether provider or model inputs changed
        id: provider-paths
        env:
          NBA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NBA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os, subprocess
          price_paths={'scripts/build_nba_odds.py','scripts/build_hardrock_feed.py','scripts/odds_provider.py','scripts/verify_nba_odds_mode.py'}
          watched={'nba_rosters.py','nba_injuries.py','nba_model.py','nba_pipeline.py','requirements.txt'} | price_paths
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['NBA_BASE_SHA'],os.environ['NBA_HEAD_SHA']],text=True).splitlines())
          needed=bool(changed & watched)
          prices=bool(changed & price_paths)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('needed='+str(needed).lower()+'\nprices='+str(prices).lower()+'\n')
          print('Live provider check required:',needed)
          PY
      - name: Refresh real NBA input feeds in disposable checkout
        if: steps.provider-paths.outputs.needed == 'true'
        run: |
          python nba_feed.py
          python nba_rosters.py
          python nba_injuries.py
      - name: Snapshot retained prices and check outage safeguards
        if: steps.provider-paths.outputs.prices == 'true'
        run: |
          python -m unittest -v tests.test_odds_provider_transport test_nba_odds test_nba_pipeline
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.verify_nba_odds_mode import fingerprint
          Path(os.environ['RUNNER_TEMP'],'nba-odds-before.json').write_text(json.dumps({'sha256':fingerprint('data/nba_market_odds.json')}))
          PY
      - name: Attempt the existing NBA provider connection once
        if: steps.provider-paths.outputs.prices == 'true'
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: python -m scripts.build_nba_odds
      - name: Run the published analyst with real current inputs
        if: steps.provider-paths.outputs.needed == 'true'
        run: python nba_pipeline.py
      - name: Verify fresh prices or identified rate-limited research mode
        if: steps.provider-paths.outputs.prices == 'true'
        run: |
          python -m scripts.verify_nba_odds_mode \
            --before "$RUNNER_TEMP/nba-odds-before.json" \
            --evidence "$RUNNER_TEMP/nba-odds-validation.json"
      - name: Record live-input evidence
        if: always() && steps.provider-paths.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nba-live-input-evidence
          path: |
            data/nba_market_status.json
            data/nba_analysis.json
            ${{ runner.temp }}/nba-odds-validation.json
          retention-days: 7

  possession-live-check:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check possession input paths
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY2'
          import os,subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE']+'...'+os.environ['HEAD']],text=True).splitlines())
          model_inputs={'nba_possession_engine.js','nba_game_context.js','nba_game_context.py','nba_feed.py','nba_shot_profile.py','nba_rotation_profile.py','nba_rosters.py','nba_injuries.py','scripts/enrich_nba_shots.py','scripts/audit_nba_projections.js'}
          selection_paths={'nba_matchup_discovery.js','scripts/verify_nba_matchup_discovery.js','scripts/compare_nba_projection_audits.js','scripts/audit_nba_rebound_selection.js','nba_game_first.js','nba_prop_evidence.js','nba_prop_lines.js','nba_parlay.js','nba_simulator_ui.js','game_odds_engine.js','scripts/publish_nba_simulator.js','tests/test_nba_rebound_selection.js'}
          needed=bool(paths & (model_inputs|selection_paths))
          model_changed=bool(paths & model_inputs)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('needed='+str(needed).lower()+'\nmodel_changed='+str(model_changed).lower()+'\n')
          print('Historical possession model/input changes:',sorted(paths & model_inputs))
          print('Audit gate:', 'original historic improvement benchmark' if model_changed else 'zero-tolerance non-regression against actual PR base; historic benchmark remains diagnostic')
          PY2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh free possession, injury and roster inputs
        if: steps.paths.outputs.needed == 'true'
        run: |
          python nba_feed.py
          python nba_rosters.py
          python nba_injuries.py
          python nba_game_context.py
      - name: Verify possession model on current source data
        if: steps.paths.outputs.needed == 'true'
        env:
          NBA_AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NBA_AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NBA_AUDIT_MODEL_CHANGED: ${{ steps.paths.outputs.model_changed }}
        run: |
          node --test tests/nba_game_first.test.js
          node test_nba_game_first_threshold.js
          node test_nba_possessions.js
          node test_nba_game_context.js
          node tests/test_nba_rebound_selection.js
          node scripts/verify_nba_matchup_discovery.js
          mkdir -p "$RUNNER_TEMP/nba-audit-baseline" "$RUNNER_TEMP/nba-audit-pr-base"
          git show ded8f5b275353e92f5228298c6e35da6255924dc:nba_possession_engine.js > "$RUNNER_TEMP/nba-audit-baseline/nba_possession_engine.js"
          git show ded8f5b275353e92f5228298c6e35da6255924dc:nba_game_context.js > "$RUNNER_TEMP/nba-audit-baseline/nba_game_context.js"
          git show "$NBA_AUDIT_BASE_SHA:nba_possession_engine.js" > "$RUNNER_TEMP/nba-audit-pr-base/nba_possession_engine.js"
          git show "$NBA_AUDIT_BASE_SHA:nba_game_context.js" > "$RUNNER_TEMP/nba-audit-pr-base/nba_game_context.js"
          node scripts/audit_nba_projections.js "$RUNNER_TEMP/nba-audit-baseline/nba_possession_engine.js" "$RUNNER_TEMP/nba-legacy-before.json"
          node scripts/audit_nba_projections.js "$RUNNER_TEMP/nba-audit-pr-base/nba_possession_engine.js" "$RUNNER_TEMP/nba-pr-base.json"
          node scripts/audit_nba_projections.js "$GITHUB_WORKSPACE/nba_possession_engine.js" "$RUNNER_TEMP/nba-after.json"
          python - <<'PYHASH'
          import hashlib,json,os,pathlib,subprocess
          files=['nba_possession_engine.js','nba_game_context.js']
          def digest(folder):return {name:hashlib.sha256((pathlib.Path(folder)/name).read_bytes()).hexdigest() for name in files}
          model_changed=os.environ['NBA_AUDIT_MODEL_CHANGED']=='true'
          evidence={'baseSha':os.environ['NBA_AUDIT_BASE_SHA'],'headSha':os.environ['NBA_AUDIT_HEAD_SHA'],'checkedOutSha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'legacySha':'ded8f5b275353e92f5228298c6e35da6255924dc','modelInputsChanged':model_changed,'comparisonMode':'historical_improvement' if model_changed else 'non_regression','prBaseCode':digest(pathlib.Path(os.environ['RUNNER_TEMP'])/'nba-audit-pr-base'),'headCode':digest(pathlib.Path(os.environ['GITHUB_WORKSPACE'])),'legacyCode':digest(pathlib.Path(os.environ['RUNNER_TEMP'])/'nba-audit-baseline'),'sourceFeedSha256':hashlib.sha256(pathlib.Path('data/nba_games.json').read_bytes()).hexdigest()}
          evidence['unchangedCoreCode']=evidence['prBaseCode']==evidence['headCode']
          pathlib.Path(os.environ['RUNNER_TEMP'],'nba-audit-source-evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          assert model_changed or evidence['unchangedCoreCode'], 'Core code changed: the original historical improvement gate is required'
          print('NBA audit source evidence:',json.dumps(evidence))
          PYHASH
          node scripts/audit_nba_rebound_selection.js "$RUNNER_TEMP/nba-after.json" "$RUNNER_TEMP/nba-legacy-before.json" "$RUNNER_TEMP/nba-rebound-selection-audit.json" "$RUNNER_TEMP/nba-audit-source-evidence.json"
          if [ "$NBA_AUDIT_MODEL_CHANGED" = 'true' ]; then
            # Actual model/input transformations retain the strict original gate.
            node scripts/compare_nba_projection_audits.js "$RUNNER_TEMP/nba-legacy-before.json" "$RUNNER_TEMP/nba-after.json" "$RUNNER_TEMP/nba-projection-comparison.json"
          else
            # Selection-only work cannot claim a new historic model improvement.
            # Retain the true legacy result, including an existing failed gate.
            node scripts/compare_nba_projection_audits.js "$RUNNER_TEMP/nba-legacy-before.json" "$RUNNER_TEMP/nba-after.json" "$RUNNER_TEMP/nba-legacy-comparison.json" || test -s "$RUNNER_TEMP/nba-legacy-comparison.json"
            node scripts/compare_nba_projection_audits.js "$RUNNER_TEMP/nba-pr-base.json" "$RUNNER_TEMP/nba-after.json" "$RUNNER_TEMP/nba-projection-comparison.json" non_regression
          fi
          python - <<'PY3'
          import json
          d=json.load(open('data/nba_game_context.json'))
          print('Free source checks:',{k:v.get('status') for k,v in d['sources'].items()})
          assert d['sources']['lineups']['status']=='ok', 'NBA.com lineup source unavailable'
          if d['sources']['tracking']['status']!='ok':
              assert not d['defenders'] or d['sources']['tracking']['status']=='partial'
              print('Tracking unavailable on this runner; dated cache/direct browser NBA.com fallback must remain explicit.')
          PY3

      - name: Save projection comparison evidence
        if: always() && steps.paths.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nba-projection-audit
          path: |
            ${{ runner.temp }}/nba-projection-comparison.json
            ${{ runner.temp }}/nba-legacy-comparison.json
            ${{ runner.temp }}/nba-rebound-selection-audit.json
            ${{ runner.temp }}/nba-audit-source-evidence.json
          retention-days: 14
