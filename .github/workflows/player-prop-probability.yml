name: NFL player prop probability holdout
on:
  push:
    paths:
      - 'player_prop_probability_backtest.py'
      - '.github/workflows/player-prop-probability.yml'
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python player_prop_probability_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-prop-probability-holdout
          path: data/player_prop_probability_backtest.json
          if-no-files-found: warn
