name: Backtest Game Picks Baseline
on:
  workflow_dispatch:
  push:
    paths:
      - 'game_picks_backtest.py'
      - 'game_picks.py'
      - '.github/workflows/game-picks-backtest.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Walk-forward historical scoring test
        run: python game_picks_backtest.py
      - name: Commit audited results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game_picks_backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update game picks walk-forward backtest"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
