name: UFC regression tests
on:
  push:
    paths:
      - 'ufc_*.js'
      - 'ufc.html'
      - 'ufc_schedule.json'
      - 'ufc_fighter_data.json'
      - 'tests/ufc*.test.js'
      - 'test_ufc*.js'
      - '.github/workflows/ufc-tests.yml'
      - '.github/workflows/refresh-ufc.yml'
      - 'scripts/refresh_ufc*.py'
      - 'scripts/validate_ufc_cache.py'
      - 'tests/test_ufc*.py'
  pull_request:
    paths:
      - 'ufc_*.js'
      - 'ufc.html'
      - 'ufc_schedule.json'
      - 'ufc_fighter_data.json'
      - 'tests/ufc*.test.js'
      - 'test_ufc*.js'
      - '.github/workflows/ufc-tests.yml'
      - '.github/workflows/refresh-ufc.yml'
      - 'scripts/refresh_ufc*.py'
      - 'scripts/validate_ufc_cache.py'
      - 'tests/test_ufc*.py'
  workflow_dispatch:
jobs:
  ufc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check UFC JavaScript syntax
        run: |
          for file in ufc_*.js; do node --check "$file"; done
      - name: Run UFC regression suite
        run: |
          node --test tests/ufc*.test.js
          for file in test_ufc*.js; do
            if [ "$file" != "test_ufc_browser.js" ]; then node "$file"; fi
          done
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run UFC browser regression
        run: UFC_CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" node test_ufc_browser.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run UFC refresh and cache regression tests
        run: python -m unittest discover -s tests -p 'test_ufc*.py'
