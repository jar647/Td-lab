name: UFC regression tests
on:
  push:
    paths:
      - 'ufc_*.js'
      - 'tests/ufc*.test.js'
      - '.github/workflows/ufc-tests.yml'
      - '.github/workflows/refresh-ufc.yml'
      - 'scripts/refresh_ufc*.py'
      - 'scripts/validate_ufc_cache.py'
      - 'tests/test_ufc*.py'
  pull_request:
    paths:
      - 'ufc_*.js'
      - 'tests/ufc*.test.js'
      - '.github/workflows/ufc-tests.yml'
      - '.github/workflows/refresh-ufc.yml'
      - 'scripts/refresh_ufc*.py'
      - 'scripts/validate_ufc_cache.py'
      - 'tests/test_ufc*.py'
  workflow_dispatch:
jobs:
  ufc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check UFC JavaScript syntax
        run: |
          for file in ufc_*.js; do node --check "$file"; done
      - name: Run UFC regression suite
        run: node --test tests/ufc*.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run UFC refresh and cache regression tests
        run: python -m unittest discover -s tests -p 'test_ufc*.py'
