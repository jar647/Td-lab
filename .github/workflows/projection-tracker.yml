name: Grade frozen player projections
on:
  workflow_dispatch:
  schedule:
    - cron: '25 14 * * 2,3'
jobs:
  grade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python projection_tracker.py
      - name: Publish ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projection_tracker.json
          if ! git diff --cached --quiet; then
            git commit -m "Update frozen player projection grading"
            git push
          fi
