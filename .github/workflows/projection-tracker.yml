name: Grade frozen player projections
on:
  workflow_dispatch:
  schedule:
    - cron: '25 14 * * 2,3'
jobs:
  grade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check tracker syntax
        run: python -m py_compile projection_tracker.py build_feed.py
      - name: Grade frozen projections
        run: python projection_tracker.py
      - name: Verify tracker output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/projection_tracker.json')
          report=json.loads(p.read_text())
          assert all(k in report for k in ('snapshots_found','eligible_snapshots','pending','summary','records'))
          print('Tracker verified: snapshots=',report['snapshots_found'],'eligible=',report['eligible_snapshots'],'predictions=',len(report['records']))
          if report['eligible_snapshots']==0:
              print('WARNING: No eligible pregame snapshot yet; waiting for next week')
          PY
      - name: Publish ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projection_tracker.json
          if ! git diff --cached --quiet; then
            git commit -m "Update frozen player projection grading"
            git push
          fi
