name: NBA.com single-source connectivity check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-nba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NBA client
        run: python -m pip install --upgrade nba_api pandas
      - name: Check NBA.com data and print diagnostic
        run: python -u scripts/check_nba_source.py
